<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Open With</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--oc-bg);
        color: var(--oc-fg);
        font: 13px/1.5 var(--oc-font, system-ui, sans-serif);
      }
      #root {
        height: 100%;
        box-sizing: border-box;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
      }
      .ow-header {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: none;
      }
      .ow-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .ow-title {
        font-weight: 650;
        font-size: 14px;
      }
      .ow-project {
        color: var(--oc-muted);
        font-size: 12px;
        word-break: break-all;
      }
      .ow-counts {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .ow-spacer {
        flex: 1 1 auto;
      }
      .ow-loading {
        display: flex;
        justify-content: center;
        padding: 16px 0;
      }
      .ow-grid {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 8px;
        align-content: start;
        padding: 2px;
      }
      .ow-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Custom web links: a grid tile with a pencil in its corner, plus an add tile. */
      .ow-tile.ow-link-tile {
        position: relative;
        padding: 0;
      }
      .ow-tile.ow-link-tile.ow-editing {
        border-color: var(--oc-primary);
      }
      .ow-link-hit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        width: 100%;
        padding: 12px 8px 10px;
        margin: 0;
        border: 0;
        border-radius: inherit;
        background: none;
        color: inherit;
        font: inherit;
        text-align: center;
        cursor: pointer;
      }
      .ow-link-hit:focus-visible {
        outline: 2px solid var(--oc-primary);
        outline-offset: -2px;
      }
      .ow-link-hit:disabled {
        cursor: not-allowed;
      }
      .ow-link-edit {
        position: absolute;
        top: 3px;
        right: 3px;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--oc-muted);
        opacity: 0.75;
        cursor: pointer;
      }
      .ow-link-tile:hover .ow-link-edit,
      .ow-link-edit:focus-visible {
        opacity: 1;
        background: var(--oc-hover);
        color: var(--oc-fg);
      }
      .ow-link-edit:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      /* Add link: a dashed tile so it reads as an action, not as an installed app. */
      .ow-tile.ow-add-tile {
        border-style: dashed;
        color: var(--oc-muted);
      }
      /* The plus gets the same 34px footprint as a brand tile, so rows line up. */
      .ow-add-icon-wrap {
        border: 1px dashed var(--oc-border);
        border-radius: 10px;
        color: var(--oc-muted);
      }
      .ow-add-icon {
        width: 18px;
        height: 18px;
      }
      .ow-link-form {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--oc-border);
        border-radius: 8px;
        background: var(--oc-surface, rgba(127, 127, 127, 0.05));
      }
      .ow-link-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .ow-link-warn {
        margin: 0;
        font-size: 11px;
        color: var(--oc-error-text, var(--oc-error, #dc2626));
      }
      .ow-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        padding: 12px 8px 10px;
        margin: 0;
        box-sizing: border-box;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius, 10px);
        background: var(--oc-surface, rgba(127, 127, 127, 0.05));
        color: inherit;
        font: inherit;
        text-align: center;
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
      }
      .ow-tile:not(.ow-missing):hover {
        border-color: var(--oc-primary);
        background: var(--oc-hover);
        transform: translateY(-1px);
      }
      .ow-tile:not(.ow-missing):focus-visible {
        outline: 2px solid var(--oc-primary);
        outline-offset: 2px;
      }
      .ow-tile.ow-missing {
        cursor: not-allowed;
      }
      .ow-icon-wrap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        flex: none;
      }
      .ow-icon {
        display: block;
        width: 34px;
        height: 34px;
        /* Installed: the brand mark in white on its brand tile. */
        color: #fff;
      }
      .ow-icon-bg {
        fill: var(--ow-brand, var(--oc-muted));
      }
      /* Not installed: a neutral tile with a muted mark, in both themes. */
      .ow-missing .ow-icon {
        color: var(--oc-muted);
      }
      .ow-missing .ow-icon-bg {
        fill: var(--oc-border);
      }
      .ow-missing .ow-name,
      .ow-missing .ow-tile-status {
        color: var(--oc-muted);
      }
      .ow-name {
        max-width: 100%;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ow-tile-status {
        font-size: 10px;
        line-height: 1;
        color: var(--oc-muted);
      }
      .ow-tile:not(.ow-missing) .ow-tile-status {
        color: var(--oc-primary);
      }
      /* Web links and the add tile keep a muted secondary line. */
      .ow-tile.ow-link-tile .ow-tile-status,
      .ow-tile.ow-add-tile .ow-tile-status {
        color: var(--oc-muted);
      }
      /* Add/edit dialog over the panel. */
      .ow-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        background: rgba(0, 0, 0, 0.48);
      }
      .ow-modal-card {
        width: min(400px, 100%);
        max-height: 100%;
        overflow: auto;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid var(--oc-border);
        border-radius: var(--oc-radius, 10px);
        background: var(--oc-elevated);
        color: var(--oc-fg);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }
      .ow-modal-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .ow-modal-title {
        flex: 1 1 auto;
        font-size: 13px;
        font-weight: 650;
      }
      .ow-modal-close {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--oc-muted);
        cursor: pointer;
      }
      .ow-modal-close:not(:disabled):hover {
        background: var(--oc-hover);
        color: var(--oc-fg);
      }
      .ow-modal-close:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }
      /* The form is the card's body, so it drops its own frame. */
      .ow-modal .ow-link-form {
        padding: 0;
        border: 0;
        background: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
